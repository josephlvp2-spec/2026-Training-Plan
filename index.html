<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinkston Training">
<title>Pinkston · 2026 Training Plan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0d0f0e;color:#e8e0d0;font-family:Georgia,'Times New Roman',serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.header{background:linear-gradient(135deg,#0d0f0e 0%,#1a1f1a 50%,#0f1410 100%);border-bottom:1px solid #2a2f2a;padding:32px 20px 24px;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(126,184,126,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(200,169,110,0.05) 0%,transparent 50%);pointer-events:none;}
.header-inner{position:relative;max-width:760px;margin:0 auto;}
.eyebrow{font-size:11px;letter-spacing:0.25em;color:#7eb87e;text-transform:uppercase;margin-bottom:8px;}
.header h1{font-size:clamp(22px,5vw,36px);font-weight:400;line-height:1.1;color:#f0e8d0;letter-spacing:-0.02em;}
.header h1 span{color:#c8a96e;}
.races{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;}
.race-badge{display:flex;align-items:center;gap:7px;}
.race-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.race-badge span{font-size:12px;color:#b0a890;}
.race-badge strong{color:#e8e0d0;font-weight:400;}
.mode-nav{background:#0e100e;border-bottom:1px solid #1c1e1c;overflow-x:auto;scrollbar-width:none;}
.mode-nav::-webkit-scrollbar{display:none;}
.mode-nav-inner{display:flex;max-width:760px;margin:0 auto;}
.mode-btn{background:none;border:none;cursor:pointer;padding:13px 14px;border-bottom:2px solid transparent;font-size:11px;letter-spacing:0.1em;font-family:Georgia,serif;white-space:nowrap;color:#555;text-transform:uppercase;-webkit-appearance:none;transition:color .2s;}
.mode-btn.active{color:var(--mc);border-bottom-color:var(--mc);}
.phase-nav{background:#111412;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none;}
.phase-nav::-webkit-scrollbar{display:none;}
.phase-nav-inner{display:flex;max-width:760px;margin:0 auto;min-width:max-content;padding:0 4px;}
.phase-btn{background:none;border:none;cursor:pointer;padding:10px 12px;border-bottom:2px solid transparent;font-size:11px;letter-spacing:0.05em;font-family:Georgia,serif;white-space:nowrap;color:#555;-webkit-appearance:none;transition:color .2s;}
.phase-btn.active{color:var(--pc);border-bottom-color:var(--pc);}
.main{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
/* selector pills */
.selector-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.sel-pill{background:#111412;border:1px solid #2a2a2a;border-radius:20px;padding:7px 16px;font-size:12px;color:#666;cursor:pointer;font-family:Georgia,serif;-webkit-appearance:none;transition:all .2s;}
.sel-pill.active{color:#0d0f0e;border-color:transparent;}
/* pace guide */
.toggle-btn{background:none;border:1px solid #333;color:#888;border-radius:4px;padding:6px 12px;font-size:11px;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;font-family:Georgia,serif;white-space:nowrap;flex-shrink:0;-webkit-appearance:none;}
.toggle-btn.on{color:#c8a96e;border-color:#c8a96e;}
.pace-guide{background:#141614;border:1px solid #2a2a2a;border-radius:8px;padding:16px;margin-bottom:20px;display:none;}
.pace-guide.open{display:block;}
.pg-label{font-size:11px;letter-spacing:0.2em;color:#666;text-transform:uppercase;margin-bottom:12px;}
.pace-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.pace-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
.pace-info{flex:1;min-width:130px;}
.pace-zone{font-size:13px;}
.pace-feel{font-size:11px;color:#888;margin-top:1px;}
.pace-val{font-size:14px;color:#e8e0d0;font-family:monospace;flex-shrink:0;}
/* week cards */
.phase-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.phase-title{font-size:21px;font-weight:400;}
.phase-sub{font-size:13px;color:#888;margin-top:4px;}
.week-card{margin-bottom:8px;border:1px solid #222;border-radius:8px;overflow:hidden;background:#111412;}
.week-card.open{border-color:var(--wca,#444);}
.week-card.is-down{background:#141210;}
.week-card.is-race{background:#131416;}
.week-btn{width:100%;background:none;border:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;text-align:left;-webkit-appearance:none;}
.week-left{display:flex;align-items:center;gap:12px;}
.week-tag{font-size:11px;font-family:Georgia,serif;letter-spacing:0.1em;min-width:58px;flex-shrink:0;}
.week-dates{font-size:13px;color:#e8e0d0;}
.week-right{display:flex;align-items:center;gap:12px;}
.week-mi{font-size:12px;color:#888;}
.week-tog{color:#444;font-size:20px;line-height:1;}
.week-body{padding:0 16px 16px;border-top:1px solid #1e1e1e;display:none;}
.week-body.open{display:block;}
.days-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.day-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#0d0f0e;border-radius:6px;border-left:3px solid #555;}
.day-lbl{font-size:13px;color:#888;min-width:36px;flex-shrink:0;padding-top:1px;}
.day-info{flex:1;}
.day-type{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px;}
.day-detail{font-size:13px;color:#c8c0b0;line-height:1.5;}
.coach-note{margin-top:12px;padding:10px 12px;background:#0a0c0a;border-radius:6px;}
.cn-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:4px;opacity:0.6;}
.cn-text{font-size:13px;color:#9a9288;line-height:1.6;}
.phase-footer{margin-top:20px;padding:16px;border-radius:8px;}
.fl{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px;}
.fi{display:flex;gap:8px;margin-bottom:7px;}
.fi-dash{flex-shrink:0;}
.fi-text{font-size:13px;color:#9a9288;line-height:1.5;}
/* lift */
.workout-header{margin-bottom:16px;}
.workout-title{font-size:20px;font-weight:400;}
.workout-sub{font-size:13px;color:#888;margin-top:4px;}
.workout-note{font-size:12px;margin-top:10px;padding:9px 12px;background:#141614;border-radius:5px;border-left:3px solid #888;color:#b0a890;line-height:1.5;}
.callout{background:#131210;border:1px solid #2a2218;border-radius:8px;padding:14px 16px;margin-bottom:16px;}
.callout-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#c8904e;margin-bottom:8px;}
.callout-text{font-size:13px;color:#9a9080;line-height:1.65;}
.sec-label{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:#555;margin:18px 0 8px;}
.ex-card{background:#111412;border:1px solid #1e201e;border-radius:8px;margin-bottom:7px;overflow:hidden;}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;}
.ex-num{font-size:11px;color:#444;min-width:18px;padding-top:2px;flex-shrink:0;font-family:monospace;}
.ex-main{flex:1;}
.ex-name{font-size:14px;color:#e8e0d0;line-height:1.3;}
.ex-sets{font-size:12px;color:#777;margin-top:3px;}
.ex-tag{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:5px;vertical-align:middle;background:rgba(0,0,0,0.3);}
.scheme-badge{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-left:5px;vertical-align:middle;border:1px solid;}
.ex-chev{color:#333;font-size:15px;flex-shrink:0;padding-top:3px;transition:transform .2s;}
.ex-chev.open{transform:rotate(45deg);}
.ex-body{padding:0 14px 13px 14px;display:none;}
.ex-body.open{display:block;}
.ex-cue{font-size:12px;color:#8a8278;line-height:1.65;margin-bottom:10px;}
.ex-why{font-size:11px;color:#686058;margin-top:7px;font-style:italic;line-height:1.5;}
/* set tracker */
.set-tracker{background:#0d0f0e;border-radius:8px;padding:12px;margin-bottom:8px;}
.set-tracker-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-row:last-child{margin-bottom:0;}
.set-lbl{font-size:11px;color:#555;min-width:52px;flex-shrink:0;}
.set-reps-target{font-size:11px;color:#888;min-width:48px;flex-shrink:0;}
.set-input{background:#1a1c1a;border:1px solid #2a2a2a;border-radius:5px;color:#e8e0d0;font-family:Georgia,serif;font-size:13px;padding:6px 8px;width:60px;text-align:center;-webkit-appearance:none;}
.set-input:focus{outline:none;border-color:#555;}
.set-x{font-size:12px;color:#444;}
.set-unit{font-size:11px;color:#555;}
/* pyramax */
.pyramax-block{background:#0d0f0e;border-radius:8px;padding:12px;margin-bottom:8px;}
.pyramax-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:4px;}
.pyramax-desc{font-size:11px;color:#666;line-height:1.6;margin-bottom:10px;}
.pyr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pyr-row:last-child{margin-bottom:0;}
.pyr-lbl{font-size:12px;min-width:80px;flex-shrink:0;}
.pyr-input{background:#1a1c1a;border:1px solid #2a2a2a;border-radius:5px;color:#e8e0d0;font-family:Georgia,serif;font-size:13px;padding:6px 8px;width:72px;text-align:center;-webkit-appearance:none;}
.pyr-input:focus{outline:none;border-color:#555;}
/* failure */
.failure-block{background:#0d0f0e;border-radius:8px;padding:12px;margin-bottom:8px;}
.failure-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#7e9ee8;margin-bottom:10px;}
/* mob */
.mob-day-card{background:#111412;border:1px solid #1e201e;border-radius:8px;margin-bottom:8px;overflow:hidden;}
.mob-day-head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;}
.mob-day-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mob-day-name{font-size:14px;color:#e8e0d0;}
.mob-day-focus{font-size:11px;color:#777;margin-top:2px;}
.mob-day-chev{color:#333;font-size:15px;transition:transform .2s;margin-left:auto;}
.mob-day-chev.open{transform:rotate(45deg);}
.mob-day-body{padding:0 16px 14px;border-top:1px solid #1e1e1e;display:none;}
.mob-day-body.open{display:block;}
.mob-tag{font-size:10px;color:#555;padding:8px 0 10px;letter-spacing:0.12em;text-transform:uppercase;}
.mob-move{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #181818;}
.mob-move:last-child{border-bottom:none;}
.mob-time{font-size:12px;color:#c8a96e;min-width:48px;flex-shrink:0;padding-top:1px;font-family:monospace;}
.mob-info{flex:1;}
.mob-move-name{font-size:14px;color:#e0d8c8;}
.mob-move-detail{font-size:12px;color:#888;margin-top:4px;line-height:1.6;}
/* diet */
.diet-date-banner{background:#141210;border:1px solid #2a2218;border-radius:8px;padding:14px 16px;margin-bottom:14px;}
.diet-date{font-size:16px;color:#c8a96e;}
.diet-date-sub{font-size:11px;color:#666;margin-top:2px;}
.meal-check-card{background:#111412;border:1px solid #1e201e;border-radius:8px;margin-bottom:8px;overflow:hidden;transition:border-color .2s;cursor:pointer;}
.meal-check-card.checked{border-color:rgba(126,184,126,0.5);background:#101412;}
.meal-check-head{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.meal-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid #333;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.meal-check-card.checked .meal-checkbox{background:#7eb87e;border-color:#7eb87e;}
.meal-check-icon{color:#fff;font-size:13px;opacity:0;transition:opacity .2s;}
.meal-check-card.checked .meal-check-icon{opacity:1;}
.meal-check-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.meal-check-name{font-size:14px;color:#e8e0d0;}
.meal-check-card.checked .meal-check-name{color:#9a9288;}
.meal-check-sub{font-size:11px;margin-top:2px;}
.diet-progress{background:#111412;border:1px solid #1e201e;border-radius:8px;padding:14px 16px;margin-bottom:14px;}
.dp-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#555;margin-bottom:10px;}
.dp-bar-bg{background:#1a1c1a;border-radius:4px;height:6px;overflow:hidden;}
.dp-bar-fill{height:6px;border-radius:4px;background:linear-gradient(90deg,#7eb87e,#c8a96e);transition:width .3s;}
.dp-count{font-size:12px;color:#888;margin-top:6px;}
/* today tracker */
.dt-card{background:#111412;border:1px solid #1e201e;border-radius:8px;padding:16px;margin-bottom:14px;}
.dt-date{font-size:16px;color:#c8a96e;margin-bottom:4px;}
.dt-sub{font-size:11px;color:#555;margin-bottom:14px;}
.dt-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #181818;cursor:pointer;}
.dt-row:last-child{border-bottom:none;}
.dt-check{width:24px;height:24px;border-radius:6px;border:2px solid #333;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dt-row.done .dt-check{background:#7eb87e;border-color:#7eb87e;}
.dt-check-icon{color:#fff;font-size:14px;opacity:0;}
.dt-row.done .dt-check-icon{opacity:1;}
.dt-label{font-size:14px;color:#c8c0b0;flex:1;}
.dt-row.done .dt-label{color:#666;text-decoration:line-through;}
.dt-emoji{font-size:16px;flex-shrink:0;}
@media(max-width:400px){.header{padding:22px 14px 20px;}.main{padding:14px 12px 60px;}.ex-body{padding:0 12px 13px 12px;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="eyebrow">Pinkston · 2026 Training Plan</div>
    <h1>Leave Fatigue<br><span>in the Dust.</span></h1>
    <div class="races">
      <div class="race-badge"><div class="race-dot" style="background:#e87e7e"></div><span>50-Miler — <strong>Oct 3, 2026</strong></span></div>
      <div class="race-badge"><div class="race-dot" style="background:#7e9ee8"></div><span>Sub-1:22 Half — <strong>Nov 14, 2026</strong></span></div>
    </div>
  </div>
</div>
<div class="mode-nav">
  <div class="mode-nav-inner">
    <button class="mode-btn active" style="--mc:#7eb87e" onclick="setMode('run')">Run</button>
    <button class="mode-btn" style="--mc:#c8784e" onclick="setMode('lift')">Lift</button>
    <button class="mode-btn" style="--mc:#9e78c8" onclick="setMode('mob')">Mobility</button>
    <button class="mode-btn" style="--mc:#c8a96e" onclick="setMode('diet')">Diet</button>
    <button class="mode-btn" style="--mc:#7e9ee8" onclick="setMode('track')">Today</button>
  </div>
</div>
<div id="phaseNav" class="phase-nav" style="display:none"><div class="phase-nav-inner" id="phaseNavInner"></div></div>
<div class="main" id="main"></div>

    {n:"Skull Crusher + Press",sets:"3 × 10",tag:"Triceps",tc:"#9e78c8",scheme:"straight",sets_n:3,key:"skullcrush",cue:"Lower bar to forehead (skull crusher), then press from that position (close-grip press). One fluid set.",why:"Hits all three tricep heads in a single movement."},
    {n:"Incline DB Curl",sets:"3 × 10",tag:"Bicep Peak",tc:"#b87eb8",scheme:"straight",sets_n:3,key:"inclinecurl",cue:"45–60° incline, arms hang fully behind torso. Full stretch at bottom. 3-sec descent.",why:"Long head stretch — builds the peak."},
    {n:"Single-Arm Preacher Curl",sets:"RPT · 3 sets",tag:"Biceps",tc:"#b87eb8",scheme:"rpt",key:"preacher",rptRanges:["4–6","6–8","8–10"],cue:"Full stretch at bottom, full contraction at top. Single arm — full focus on each side.",why:"Strict curl with full range. RPT builds peak strength and size."},
    {n:"Single-Arm Front Shoulder Press",sets:"3 × 10",tag:"Front Delt",tc:"#c8784e",scheme:"straight",sets_n:3,key:"frontpress",cue:"Single arm, seated or standing. Press straight up. Control the descent. Each arm fully.",why:"Anterior delt strength and size. Single arm catches imbalances."}
  ];

  if(liftCount===3) return [{label:"Workout 1 — Push",color:"#c8784e",sched:"Lift → then run",exercises:push3},{label:"Workout 2 — Pull",color:"#7e9ee8",sched:"Lift → then run",exercises:pull},{label:"Workout 3 — Legs",color:"#7eb87e",sched:"Legs only → 20–30 min treadmill incline hike after · no running",exercises:legs,callout:"Two goals: strength/size (Back Squat) and glute growth (Banded Kickbacks, supersetted right after) plus ultra durability (everything else)."}];
  return [{label:"Workout 1 — Push",color:"#c8784e",sched:"Lift → then run",exercises:push4},{label:"Workout 2 — Pull",color:"#7e9ee8",sched:"Lift → then run",exercises:pull},{label:"Workout 3 — Legs",color:"#7eb87e",sched:"Legs only → 20–30 min treadmill incline hike after · no running",exercises:legs,callout:"Two goals: strength/size (Back Squat) and glute growth (Banded Kickbacks, supersetted right after) plus ultra durability (everything else)."},{label:"Workout 4 — Arms",color:"#b87eb8",sched:"Lift → then run · fun day",exercises:arms}];
}

// ─── MOBILITY ──────────────────────────────────────────────────────────────
// Workout 3's block is the heel/ankle priority routine — runs BEFORE every leg session in every phase.
const MOB_DAYS=[
{day:"Workout 1 (Push)",focus:"Shoulder opener + chest stretch",color:"#c8784e",context:"Before lifting",moves:[
{time:"2:00",name:"Band Shoulder Dislocates",detail:"Wide grip on a band or PVC. Pass overhead and behind slowly — 10 reps. Then hold end range 10 sec each direction. Opens the full shoulder capsule before heavy pressing."},
{time:"2:00",name:"Doorway Chest Stretch",detail:"Forearm on door frame at 90°. Step through until you feel the pec and front delt. Hold 45 sec each side. Counteracts the forward-shoulder position that builds from bench and overhead press."}
]},
{day:"Workout 2 (Pull)",focus:"Hamstring + posterior chain",color:"#7eb87e",context:"After running · while warm",moves:[
{time:"2:00",name:"Supine Hamstring Stretch",detail:"On your back. Pull one leg straight toward you — hand behind the thigh. Hold 45–60 sec. Breathe into the stretch. Switch sides. Do this immediately after your run while the tissue is warm."},
{time:"2:00",name:"World's Greatest Stretch",detail:"From a lunge: front hand inside front foot, rotate elbow toward the floor, then reach to the ceiling. 5 slow reps each side. Hits hip flexor, hamstring, thoracic rotation, and groin in one movement."}
]},
{day:"Workout 3 (Legs)",focus:"Heel / plantar fascia + ankle — problem area, do first",color:"#c8a96e",context:"BEFORE your leg workout, every time",moves:[
{time:"2:00",name:"Plantar Fascia + Calf Roll",detail:"Roll the arch of the heel-side foot on a frozen water bottle or lacrosse ball — light pressure, 60 sec. Then roll the calf same side on a foam roller, 60 sec. This goes first, before anything else, while the heel is recovering."},
{time:"3:00",name:"Wall Ankle Dorsiflexion Stretch",detail:"Toes 2–4 inches from wall. Drive knee forward over pinky toe without heel rising. Hold 45 sec each side. 3 rounds each side. Move toes back as range improves."},
{time:"1:30",name:"Single-Leg Heel Drops (unloaded)",detail:"Stand on a step edge. Lower heel slowly — 4-sec descent — below the step level. Just touch, don't load. Drive back up. 10 reps each side. Skip this move entirely if it's sharp or sore at the heel — stick to the roll and the wall stretch until cleared."}
]},
{day:"Workout 4 (Arms)",focus:"Hip mobility + lower back",color:"#b87eb8",context:"Before or after lifting",moves:[
{time:"2:00",name:"Standing Hip CARs",detail:"Stand on one foot. Draw the largest possible circle with your lifted knee — hip joint only. 8 slow circles each direction, each side. Own every degree of range. Active hip mobility — trains the joint, not just the muscle."},
{time:"2:00",name:"Cat-Cow + Child's Pose",detail:"On all fours: 10 slow cat-cows (arch and round the full spine). Then sit back into child's pose — arms extended, hold 45 sec. Decompresses the lower back after a full week of running, squatting, and hinging."}
]}
];

// ─── DIET ──────────────────────────────────────────────────────────────────
const MEALS=[{id:"breakfast",name:"Breakfast",dot:"#f0c030"},{id:"amsnack",name:"AM Snack",dot:"#7eb87e"},{id:"lunch",name:"Lunch",dot:"#7e9ee8"},{id:"pmsnack",name:"PM Snack",dot:"#9e9e9e"},{id:"evesnack",name:"Evening Snack",dot:"#e8a05e"},{id:"dinner",name:"Dinner",dot:"#b87eb8"}];

// ─── STATE ─────────────────────────────────────────────────────────────────
let mode='run',activePhase=0,openWeek=null,paceOpen=false,liftCount=4,activeWorkout=0,openEx=null,openMobDay=null,weekendMode='2';

function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function todayDisplay(){return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}

// persist preferences
function initPrefs(){
  liftCount=parseInt(lsGet('pref_liftcount'))||4;
  weekendMode=lsGet('pref_weekend')||'2';
}

function render(){
  document.getElementById('phaseNav').style.display=mode==='run'?'block':'none';
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['run','lift','mob','diet','track'][i]===mode));
  if(mode==='run'){buildPhaseNav();buildRunMain();}
  else if(mode==='lift'){buildLiftMain();}
  else if(mode==='mob'){buildMobMain();}
  else if(mode==='diet'){buildDietMain();}
  else buildTrackMain();
}
function setMode(m){mode=m;openWeek=null;openEx=null;openMobDay=null;render();window.scrollTo({top:0,behavior:'smooth'});}

// ─── RUN ───────────────────────────────────────────────────────────────────
function buildPhaseNav(){
  document.getElementById('phaseNavInner').innerHTML=PHASES.map((p,i)=>`<button class="phase-btn${i===activePhase?' active':''}" style="--pc:${p.color}" onclick="setPhase(${i})">${p.label.split(' — ')[0]}</button>`).join('');
}
function setPhase(i){activePhase=i;openWeek=null;buildPhaseNav();buildRunMain();window.scrollTo({top:0,behavior:'smooth'});}

function buildRunMain(){
  const ph=PHASES[activePhase];
  const pRows=PACE_GUIDE.map(z=>`<div class="pace-row"><div class="pace-bar" style="background:${z.color}"></div><div class="pace-info"><div class="pace-zone" style="color:${z.color}">${z.zone}</div><div class="pace-feel">${z.feel}</div></div><div class="pace-val">${z.pace}</div></div>`).join('');

  // Weekend selector
  const wkndSel=`<div style="margin-bottom:18px"><div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#555;margin-bottom:8px">Weekend Days Available</div><div class="selector-bar"><button class="sel-pill${weekendMode==='2'?' active':''}" style="${weekendMode==='2'?'background:#7eb87e;':''}" onclick="setWeekend('2')">2 Days — Long + Back-to-Back</button><button class="sel-pill${weekendMode==='1'?' active':''}" style="${weekendMode==='1'?'background:#c8a96e;':''}" onclick="setWeekend('1')">1 Day — Long Run Only</button></div></div>`;

  const wCards=ph.weeks.map((w,wi)=>{
    const isDown=String(w.totalMi).includes('DOWN'),isRace=w.totalMi==='RACE WEEK',isOpen=openWeek===wi;
    const tag=isRace?'🏁 RACE':isDown?'↓ DOWN':(typeof w.week==='number'&&w.week>=1&&Number.isInteger(w.week))?`Wk ${w.week}`:'';
    const tc=isRace?'#f0c030':isDown?'#e8904e':ph.color;
    const days=weekendMode==='2'?w.days2:w.days1;
    const dRows=days.map(d=>{const c=TYPE_COLORS[d.type]||'#888';return`<div class="day-row" style="border-left-color:${c}"><div class="day-lbl">${d.lbl}</div><div class="day-info"><div class="day-type" style="color:${c}">${d.type}</div><div class="day-detail">${d.detail}</div></div></div>`;}).join('');
    const note=w.notes?`<div class="coach-note" style="border-left-color:${ph.color}55"><div class="cn-label" style="color:${ph.color}">Coach's Note</div><div class="cn-text">${w.notes}</div></div>`:'';
    return`<div class="week-card${isOpen?' open':''}${isDown?' is-down':''}${isRace?' is-race':''}" style="--wca:${ph.alpha}"><button class="week-btn" onclick="toggleWeek(${wi})"><div class="week-left"><div class="week-tag" style="color:${tc}">${tag}</div><div class="week-dates">${w.dates}</div></div><div class="week-right"><div class="week-mi">${isRace?'Race day':'~'+w.totalMi+' mi'}</div><div class="week-tog">${isOpen?'−':'+'}</div></div></button><div class="week-body${isOpen?' open':''}"><div class="days-list">${dRows}</div>${note}</div></div>`;
  }).join('');
  let footer='';
  if(ph.footer){footer=`<div class="phase-footer" style="background:${ph.footer.bg};border:1px solid ${ph.footer.border}"><div class="fl" style="color:${ph.color}">${ph.footer.label}</div>${ph.footer.items.map(n=>`<div class="fi"><span class="fi-dash" style="color:${ph.color}">—</span><span class="fi-text">${n}</span></div>`).join('')}</div>`;}
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:${ph.color}">${ph.label}</div><div class="phase-sub">${ph.dates} · ${ph.subtitle}</div></div><button class="toggle-btn${paceOpen?' on':''}" onclick="togglePace()">${paceOpen?'Hide':'Pace'} Guide</button></div><div class="pace-guide${paceOpen?' open':''}"><div class="pg-label">Pace Zones</div>${pRows}</div>${wkndSel}${wCards}${footer}`;
}
function toggleWeek(wi){openWeek=openWeek===wi?null:wi;buildRunMain();}
function togglePace(){paceOpen=!paceOpen;buildRunMain();}
function setWeekend(v){weekendMode=v;lsSet('pref_weekend',v);buildRunMain();}

// ─── LIFT ──────────────────────────────────────────────────────────────────
function buildSetTracker(exKey,scheme,rptRanges,setsN){
  if(scheme==='pyramax'){
    const stages=[{l:"8-rep max",k:`${exKey}_8`},{l:"4-rep max",k:`${exKey}_4`},{l:"2-rep max",k:`${exKey}_2`},{l:"1-rep max",k:`${exKey}_1`}];
    const rows=stages.map(s=>`<div class="set-row"><span class="set-lbl">${s.l}</span><input class="set-input" type="number" inputmode="numeric" placeholder="lbs" value="${lsGet(s.k)}" onchange="lsSet('${s.k}',this.value)"><span class="set-unit">lbs</span></div>`).join('');
    return`<div class="pyramax-block"><div class="pyramax-label" style="color:#e8a05e">Pyramax — Last Session</div><div class="pyramax-desc">Start light · climb in 5–10 lb jumps · 8 reps → 4 → 2 → 1 until failure at each stage.</div>${rows}</div>`;
  }
  if(scheme==='failure'){
    const rows=[1,2,3].map(i=>`<div class="set-row"><span class="set-lbl">Set ${i}</span><input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${lsGet(exKey+'_s'+i+'_r')}" onchange="lsSet('${exKey}_s${i}_r',this.value)"><span class="set-unit">reps</span></div>`).join('');
    return`<div class="failure-block"><div class="failure-label">To Failure — Last Session</div>${rows}</div>`;
  }
  if(scheme==='rpt'){
    const rows=rptRanges.map((range,i)=>`<div class="set-row"><span class="set-lbl">Set ${i+1}</span><span class="set-reps-target" style="color:#666">${range}</span><input class="set-input" type="number" inputmode="numeric" placeholder="lbs" value="${lsGet(exKey+'_s'+(i+1)+'_w')}" onchange="lsSet('${exKey}_s${i+1}_w',this.value)"><span class="set-x">×</span><input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${lsGet(exKey+'_s'+(i+1)+'_r')}" onchange="lsSet('${exKey}_s${i+1}_r',this.value)"></div>`).join('');
    return`<div class="set-tracker"><div class="set-tracker-label" style="color:#c8a96e">RPT — Last Session</div>${rows}</div>`;
  }
  const n=setsN||3;
  const rows=Array.from({length:n},(_,i)=>`<div class="set-row"><span class="set-lbl">Set ${i+1}</span><input class="set-input" type="number" inputmode="numeric" placeholder="lbs" value="${lsGet(exKey+'_s'+(i+1)+'_w')}" onchange="lsSet('${exKey}_s${i+1}_w',this.value)"><span class="set-x">×</span><input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${lsGet(exKey+'_s'+(i+1)+'_r')}" onchange="lsSet('${exKey}_s${i+1}_r',this.value)"></div>`).join('');
  return`<div class="set-tracker"><div class="set-tracker-label" style="color:#888">Last Session</div>${rows}</div>`;
}

function schemeBadge(scheme){
  if(scheme==='rpt') return`<span class="scheme-badge" style="color:#c8a96e;border-color:rgba(200,169,110,0.4)">RPT</span>`;
  if(scheme==='pyramax') return`<span class="scheme-badge" style="color:#e8a05e;border-color:rgba(232,160,94,0.4)">Pyramax</span>`;
  if(scheme==='failure') return`<span class="scheme-badge" style="color:#7e9ee8;border-color:rgba(126,158,232,0.4)">Failure</span>`;
  return'';
}

function buildLiftMain(){
  const workouts=makeExercises(liftCount);
  const wo=workouts[activeWorkout]||workouts[0];

  const countSel=`<div style="margin-bottom:16px"><div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#555;margin-bottom:8px">Lifts This Week</div><div class="selector-bar"><button class="sel-pill${liftCount===3?' active':''}" style="${liftCount===3?'background:#c8784e;':''}" onclick="setLiftCount(3)">3 Lifts — Push / Pull / Legs</button><button class="sel-pill${liftCount===4?' active':''}" style="${liftCount===4?'background:#7eb87e;':''}" onclick="setLiftCount(4)">4 Lifts — Push / Pull / Legs / Arms</button></div></div>`;

  const tabs=workouts.map((w,i)=>`<button class="sel-pill${i===activeWorkout?' active':''}" style="${i===activeWorkout?'background:'+w.color+';color:#0d0f0e;':''}" onclick="setWorkout(${i})">${w.label.split(' — ')[0]}</button>`).join('');
  const tabBar=`<div class="selector-bar" style="margin-bottom:18px">${tabs}</div>`;

  const callout=wo.callout?`<div class="callout"><div class="callout-title">This Session</div><div class="callout-text">${wo.callout}</div></div>`:'';

  let idx=0;
  const exCards=wo.exercises.map(ex=>{
    const key=`${liftCount}_w${activeWorkout}_${ex.key}`;
    const isOpen=openEx===key;idx++;
    const tracker=isOpen?buildSetTracker(key,ex.scheme,ex.rptRanges,ex.sets_n):'';
    return`<div class="ex-card"><div class="ex-head" onclick="toggleEx('${key}')"><div class="ex-num">${String(idx).padStart(2,'0')}</div><div class="ex-main"><div class="ex-name">${ex.n}<span class="ex-tag" style="color:${ex.tc};border:1px solid ${ex.tc}44">${ex.tag}</span>${schemeBadge(ex.scheme)}</div><div class="ex-sets">${ex.sets}</div></div><div class="ex-chev${isOpen?' open':''}">+</div></div><div class="ex-body${isOpen?' open':''}"><div class="ex-cue">${ex.cue}</div>${tracker}<div class="ex-why">Why: ${ex.why}</div></div></div>`;
  }).join('');

  document.getElementById('main').innerHTML=`${countSel}${tabBar}<div class="workout-header"><div class="workout-title" style="color:${wo.color}">${wo.label}</div><div class="workout-note" style="border-left-color:${wo.color}">${wo.sched}</div></div>${callout}${exCards}`;
}
function setLiftCount(n){liftCount=n;lsSet('pref_liftcount',n);activeWorkout=0;openEx=null;buildLiftMain();}
function setWorkout(i){activeWorkout=i;openEx=null;buildLiftMain();}
function toggleEx(key){openEx=openEx===key?null:key;buildLiftMain();}

// ─── MOBILITY ─────────────────────────────────────────────────────────────
function buildMobMain(){
  const cards=MOB_DAYS.map((d,i)=>{
    const isOpen=openMobDay===i;
    const moves=d.moves.map(m=>`<div class="mob-move"><div class="mob-time">${m.time}</div><div class="mob-info"><div class="mob-move-name">${m.name}</div><div class="mob-move-detail">${m.detail}</div></div></div>`).join('');
    return`<div class="mob-day-card"><div class="mob-day-head" onclick="toggleMobDay(${i})"><div class="mob-day-dot" style="background:${d.color}"></div><div><div class="mob-day-name">${d.day}</div><div class="mob-day-focus" style="color:${d.color}">${d.focus}</div></div><div style="flex:1"></div><div class="mob-day-chev${isOpen?' open':''}">+</div></div><div class="mob-day-body${isOpen?' open':''}"><div class="mob-tag">${d.context}</div>${moves}</div></div>`;
  }).join('');
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:#9e78c8">Daily Mobility</div><div class="phase-sub">2–3 movements per workout day · tied to lift/run days only</div></div></div><div class="callout" style="border-color:#2a1e2a"><div class="callout-title" style="color:#9e78c8">Simple Rule</div><div class="callout-text">Mobility lives on lift/run days only, not as a separate daily block. Workout 3's heel/ankle routine goes BEFORE legs — that's the priority block right now. Workout 2's hamstring routine goes after your run, while warm. Everything else goes before lifting.</div></div>${cards}`;
}
function toggleMobDay(i){openMobDay=openMobDay===i?null:i;buildMobMain();}

// ─── DIET ─────────────────────────────────────────────────────────────────
function getDietKey(id){return`diet_${todayStr()}_${id}`;}
function getMealChecked(id){return lsGet(getDietKey(id))==='1';}
function setMealChecked(id,val){lsSet(getDietKey(id),val?'1':'0');buildDietMain();}
function getCheckedCount(){return MEALS.filter(m=>getMealChecked(m.id)).length;}
function buildDietMain(){
  const count=getCheckedCount();
  const pct=Math.round((count/MEALS.length)*100);
  const banner=`<div class="diet-date-banner"><div><div class="diet-date">${todayDisplay()}</div><div class="diet-date-sub">${count} of ${MEALS.length} meals — was it healthy?</div></div></div>`;
  const progress=`<div class="diet-progress"><div class="dp-label">Today</div><div class="dp-bar-bg"><div class="dp-bar-fill" style="width:${pct}%"></div></div><div class="dp-count">${count}/${MEALS.length}${pct===100?' · 🏆 Clean day':''}</div></div>`;
  const cards=MEALS.map(m=>{
    const checked=getMealChecked(m.id);
    return`<div class="meal-check-card${checked?' checked':''}" onclick="setMealChecked('${m.id}',${!checked})"><div class="meal-check-head"><div class="meal-checkbox"><span class="meal-check-icon">✓</span></div><div class="meal-check-dot" style="background:${m.dot}"></div><div style="flex:1"><div class="meal-check-name">${m.name}</div><div class="meal-check-sub" style="color:${checked?'#7eb87e':'#555'}">${checked?'Healthy ✓':'Tap to check off'}</div></div></div></div>`;
  }).join('');
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:#c8a96e">Nutrition</div><div class="phase-sub">Was it healthy? · resets at midnight</div></div></div>${banner}${progress}${cards}`;
}

// ─── TODAY TRACKER ────────────────────────────────────────────────────────
const TRACK_ITEMS=[{id:"mfp",label:"Logged in MyFitnessPal",emoji:"📱"},{id:"mob",label:"Mobility done",emoji:"🧘"},{id:"lift",label:"Lift done",emoji:"🏋️"},{id:"run",label:"Run done",emoji:"👟"}];
function getTrackKey(id){return`track_${todayStr()}_${id}`;}
function getTrackDone(id){return lsGet(getTrackKey(id))==='1';}
function toggleTrack(id){lsSet(getTrackKey(id),getTrackDone(id)?'0':'1');buildTrackMain();}
function buildTrackMain(){
  const doneCount=TRACK_ITEMS.filter(t=>getTrackDone(t.id)).length;
  const allDone=doneCount===TRACK_ITEMS.length;
  const rows=TRACK_ITEMS.map(t=>{const done=getTrackDone(t.id);return`<div class="dt-row${done?' done':''}" onclick="toggleTrack('${t.id}')"><div class="dt-check"><span class="dt-check-icon">✓</span></div><span class="dt-label">${t.label}</span><span class="dt-emoji">${t.emoji}</span></div>`;}).join('');
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:#7e9ee8">Today</div><div class="phase-sub">Resets automatically at midnight</div></div></div><div class="dt-card"><div class="dt-date">${todayDisplay()}</div><div class="dt-sub">${doneCount} of ${TRACK_ITEMS.length} complete${allDone?' · 🏆 Full day done':''}</div>${rows}</div><div class="callout" style="border-color:#1e1e2a"><div class="callout-title" style="color:#7e9ee8">The Standard</div><div class="callout-text">Log it. Move. Lift. Run. Four checkboxes. Every day you get all four is a day that compounds.</div></div>`;
}

// ─── INIT ──────────────────────────────────────────────────────────────────
initPrefs();
render();
</script>
</body>
</html>
