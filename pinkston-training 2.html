<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinkston Training">
<title>Pinkston · 2026 Training Plan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0d0f0e; color: #e8e0d0; font-family: Georgia,'Times New Roman',serif; min-height:100vh; -webkit-font-smoothing:antialiased; }

.header { background:linear-gradient(135deg,#0d0f0e 0%,#1a1f1a 50%,#0f1410 100%); border-bottom:1px solid #2a2f2a; padding:36px 20px 28px; position:relative; overflow:hidden; }
.header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 20% 50%,rgba(126,184,126,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(200,169,110,0.05) 0%,transparent 50%); pointer-events:none; }
.header-inner { position:relative; max-width:760px; margin:0 auto; }
.eyebrow { font-size:11px; letter-spacing:0.25em; color:#7eb87e; text-transform:uppercase; margin-bottom:8px; }
.header h1 { font-size:clamp(24px,5vw,38px); font-weight:400; line-height:1.1; color:#f0e8d0; letter-spacing:-0.02em; }
.header h1 span { color:#c8a96e; }
.races { margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; }
.race-badge { display:flex; align-items:center; gap:7px; }
.race-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.race-badge span { font-size:12px; color:#b0a890; }
.race-badge strong { color:#e8e0d0; font-weight:400; }

.mode-nav { background:#0e100e; border-bottom:1px solid #1c1e1c; overflow-x:auto; scrollbar-width:none; }
.mode-nav::-webkit-scrollbar { display:none; }
.mode-nav-inner { display:flex; max-width:760px; margin:0 auto; }
.mode-btn { background:none; border:none; cursor:pointer; padding:14px 16px; border-bottom:2px solid transparent; font-size:12px; letter-spacing:0.1em; font-family:Georgia,serif; white-space:nowrap; color:#555; text-transform:uppercase; -webkit-appearance:none; transition:color .2s; }
.mode-btn.active { color:var(--mc); border-bottom-color:var(--mc); }

.phase-nav { background:#111412; border-bottom:1px solid #222; overflow-x:auto; scrollbar-width:none; }
.phase-nav::-webkit-scrollbar { display:none; }
.phase-nav-inner { display:flex; max-width:760px; margin:0 auto; min-width:max-content; padding:0 4px; }
.phase-btn { background:none; border:none; cursor:pointer; padding:10px 12px; border-bottom:2px solid transparent; font-size:11px; letter-spacing:0.05em; font-family:Georgia,serif; white-space:nowrap; color:#555; -webkit-appearance:none; transition:color .2s; }
.phase-btn.active { color:var(--pc); border-bottom-color:var(--pc); }

.split-nav { background:#111412; border-bottom:1px solid #222; overflow-x:auto; scrollbar-width:none; }
.split-nav::-webkit-scrollbar { display:none; }
.split-nav-inner { display:flex; max-width:760px; margin:0 auto; min-width:max-content; padding:0 4px; }
.split-btn { background:none; border:none; cursor:pointer; padding:10px 14px; border-bottom:2px solid transparent; font-size:11px; letter-spacing:0.07em; font-family:Georgia,serif; white-space:nowrap; color:#555; text-transform:uppercase; -webkit-appearance:none; transition:color .2s; }
.split-btn.active { color:var(--sc); border-bottom-color:var(--sc); }

.main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }

.phase-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
.phase-title { font-size:21px; font-weight:400; }
.phase-sub { font-size:13px; color:#888; margin-top:4px; }
.toggle-btn { background:none; border:1px solid #333; color:#888; border-radius:4px; padding:6px 12px; font-size:11px; cursor:pointer; letter-spacing:0.1em; text-transform:uppercase; font-family:Georgia,serif; white-space:nowrap; flex-shrink:0; -webkit-appearance:none; }
.toggle-btn.on { color:#c8a96e; border-color:#c8a96e; }

.pace-guide { background:#141614; border:1px solid #2a2a2a; border-radius:8px; padding:16px; margin-bottom:20px; display:none; }
.pace-guide.open { display:block; }
.pg-label { font-size:11px; letter-spacing:0.2em; color:#666; text-transform:uppercase; margin-bottom:12px; }
.pace-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.pace-bar { width:3px; height:32px; border-radius:2px; flex-shrink:0; }
.pace-info { flex:1; min-width:130px; }
.pace-zone { font-size:13px; }
.pace-feel { font-size:11px; color:#888; margin-top:1px; }
.pace-val { font-size:14px; color:#e8e0d0; font-family:monospace; flex-shrink:0; }

.week-card { margin-bottom:8px; border:1px solid #222; border-radius:8px; overflow:hidden; transition:border-color .2s; background:#111412; }
.week-card.open { border-color:var(--wca,#444); }
.week-card.is-down { background:#141210; }
.week-card.is-race { background:#131416; }
.week-btn { width:100%; background:none; border:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; text-align:left; -webkit-appearance:none; }
.week-left { display:flex; align-items:center; gap:12px; }
.week-tag { font-size:11px; font-family:Georgia,serif; letter-spacing:0.1em; min-width:58px; flex-shrink:0; }
.week-dates { font-size:13px; color:#e8e0d0; }
.week-right { display:flex; align-items:center; gap:12px; }
.week-mi { font-size:12px; color:#888; }
.week-tog { color:#444; font-size:20px; line-height:1; }
.week-body { padding:0 16px 16px; border-top:1px solid #1e1e1e; display:none; }
.week-body.open { display:block; }
.days-list { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
.day-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:#0d0f0e; border-radius:6px; border-left:3px solid #555; }
.day-lbl { font-size:13px; color:#888; min-width:36px; flex-shrink:0; padding-top:1px; }
.day-info { flex:1; }
.day-type { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:2px; }
.day-detail { font-size:13px; color:#c8c0b0; line-height:1.5; }
.coach-note { margin-top:12px; padding:10px 12px; background:#0a0c0a; border-radius:6px; }
.cn-label { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:4px; opacity:0.6; }
.cn-text { font-size:13px; color:#9a9288; line-height:1.6; }
.phase-footer { margin-top:20px; padding:16px; border-radius:8px; }
.fl { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:10px; }
.fi { display:flex; gap:8px; margin-bottom:7px; }
.fi-dash { flex-shrink:0; }
.fi-text { font-size:13px; color:#9a9288; line-height:1.5; }

.split-header { margin-bottom:18px; }
.split-title { font-size:20px; font-weight:400; }
.split-meta { font-size:13px; color:#888; margin-top:4px; }
.split-sched { font-size:12px; margin-top:10px; padding:9px 12px; background:#141614; border-radius:5px; border-left:3px solid #888; color:#b0a890; line-height:1.5; }

.callout { background:#131210; border:1px solid #2a2218; border-radius:8px; padding:14px 16px; margin-bottom:20px; }
.callout-title { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:#c8904e; margin-bottom:8px; }
.callout-text { font-size:13px; color:#9a9080; line-height:1.65; }

.sec-label { font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:#555; margin:20px 0 8px; }
.superset-badge { font-size:10px; color:#7e9ee8; letter-spacing:0.1em; text-transform:uppercase; margin:16px 0 6px; padding-left:2px; }

.ex-card { background:#111412; border:1px solid #1e201e; border-radius:8px; margin-bottom:7px; overflow:hidden; }
.ex-card.mob { background:#101412; border-color:#1a2218; }
.ex-head { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; cursor:pointer; }
.ex-num { font-size:11px; color:#444; min-width:18px; padding-top:2px; flex-shrink:0; font-family:monospace; }
.ex-main { flex:1; }
.ex-name { font-size:14px; color:#e8e0d0; line-height:1.3; }
.ex-sets { font-size:12px; color:#777; margin-top:3px; }
.ex-tag { font-size:9px; letter-spacing:0.12em; text-transform:uppercase; padding:2px 6px; border-radius:3px; margin-left:5px; vertical-align:middle; background:rgba(0,0,0,0.3); }
.rpt-badge { font-size:9px; letter-spacing:0.1em; text-transform:uppercase; padding:2px 7px; border-radius:3px; margin-left:5px; vertical-align:middle; background:rgba(200,169,110,0.12); color:#c8a96e; border:1px solid rgba(200,169,110,0.35); }
.ex-chev { color:#333; font-size:15px; flex-shrink:0; padding-top:3px; transition:transform .2s; }
.ex-chev.open { transform:rotate(45deg); }
.ex-body { padding:0 14px 13px 42px; display:none; }
.ex-body.open { display:block; }
.ex-cue { font-size:12px; color:#8a8278; line-height:1.65; }
.ex-why { font-size:11px; color:#686058; margin-top:7px; font-style:italic; line-height:1.5; }

.rpt-block { margin-top:10px; margin-bottom:6px; background:#0d0f0e; border-radius:6px; padding:10px 12px; }
.rpt-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#c8a96e; margin-bottom:8px; }
.rpt-row { display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid #181818; }
.rpt-row:last-child { border-bottom:none; }
.rpt-set { font-size:11px; color:#555; min-width:40px; }
.rpt-reps { font-size:13px; font-family:monospace; flex:1; }
.rpt-note { font-size:11px; color:#888; font-style:italic; }
.rpt-row.top-set .rpt-reps { color:#c8a96e; }
.rpt-row.top-set .rpt-set { color:#c8a04e; }

.mob-day-card { background:#111412; border:1px solid #1e201e; border-radius:8px; margin-bottom:8px; overflow:hidden; }
.mob-day-head { display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; }
.mob-day-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mob-day-name { font-size:14px; color:#e8e0d0; }
.mob-day-focus { font-size:11px; color:#777; margin-top:2px; }
.mob-day-chev { color:#333; font-size:15px; transition:transform .2s; margin-left:auto; }
.mob-day-chev.open { transform:rotate(45deg); }
.mob-day-body { padding:0 16px 14px; border-top:1px solid #1e1e1e; display:none; }
.mob-day-body.open { display:block; }
.mob-tag { font-size:10px; color:#555; padding:8px 0 10px; letter-spacing:0.12em; text-transform:uppercase; }
.mob-move { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid #181818; }
.mob-move:last-child { border-bottom:none; }
.mob-time { font-size:12px; color:#c8a96e; min-width:48px; flex-shrink:0; padding-top:1px; font-family:monospace; }
.mob-info { flex:1; }
.mob-move-name { font-size:13px; color:#e0d8c8; }
.mob-move-detail { font-size:12px; color:#888; margin-top:3px; line-height:1.55; }

/* DIET TAB */
.diet-hero { background:#141210; border:1px solid #2a2218; border-radius:8px; padding:16px; margin-bottom:16px; }
.diet-hero-title { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#c8a96e; margin-bottom:10px; }
.diet-stats { display:flex; gap:8px; flex-wrap:wrap; }
.diet-stat { background:#0d0f0e; border:1px solid #222; border-radius:6px; padding:10px 12px; flex:1; min-width:70px; text-align:center; }
.diet-stat-val { font-size:19px; color:#c8a96e; font-family:monospace; }
.diet-stat-lbl { font-size:9px; color:#666; letter-spacing:0.12em; text-transform:uppercase; margin-top:3px; }

.meal-card { background:#111412; border:1px solid #1e201e; border-radius:8px; margin-bottom:7px; overflow:hidden; }
.meal-head { display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; }
.meal-time { font-size:10px; font-family:monospace; color:#666; min-width:42px; flex-shrink:0; }
.meal-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.meal-info { flex:1; }
.meal-name { font-size:14px; color:#e8e0d0; }
.meal-preview { font-size:11px; color:#666; margin-top:2px; }
.meal-protein { font-size:12px; font-family:monospace; color:#7eb87e; border:1px solid rgba(126,184,126,0.3); border-radius:12px; padding:2px 9px; flex-shrink:0; white-space:nowrap; }
.meal-protein.none { color:#555; border-color:#333; }
.meal-chev { color:#333; font-size:15px; flex-shrink:0; transition:transform .2s; }
.meal-chev.open { transform:rotate(45deg); }
.meal-body { padding:0 14px 14px; border-top:1px solid #1e1e1e; display:none; }
.meal-body.open { display:block; }
.meal-option { margin-top:12px; }
.meal-opt-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#666; margin-bottom:6px; }
.meal-opt-detail { font-size:13px; color:#c8c0b0; line-height:1.65; padding:9px 11px; background:#0d0f0e; border-radius:5px; border-left:3px solid #2a2a2a; }
.meal-run-note { font-size:11px; color:#7eb87e; font-style:italic; margin-top:8px; padding:6px 10px; background:rgba(126,184,126,0.06); border-radius:4px; }

.protein-summary { background:#111614; border:1px solid #1e2a1e; border-radius:8px; padding:14px 16px; margin-top:18px; }
.ps-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#555; margin-bottom:12px; }
.ps-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #181a18; }
.ps-row:last-of-type { border-bottom:none; }
.ps-meal { font-size:13px; color:#9a9288; }
.ps-p { font-size:13px; font-family:monospace; color:#7eb87e; }
.ps-total { border-top:1px solid #2a2a2a; padding-top:10px; margin-top:6px; display:flex; justify-content:space-between; }
.ps-total .ps-meal { font-size:14px; color:#e8e0d0; }
.ps-total .ps-p { font-size:15px; color:#c8a96e; }

.diet-tip { background:#101210; border:1px solid #1e261e; border-radius:8px; padding:13px 15px; margin-top:14px; }
.diet-tip-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#7eb87e; margin-bottom:6px; }
.diet-tip-text { font-size:12px; color:#7a8a78; line-height:1.65; }

@media (max-width:400px) {
  .header { padding:24px 16px 20px; }
  .main { padding:16px 12px 60px; }
  .week-btn { padding:12px 12px; }
  .week-body { padding:0 12px 12px; }
  .ex-body { padding:0 12px 12px 38px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="eyebrow">Pinkston · 2026 Training Plan</div>
    <h1>Leave Fatigue<br><span>in the Dust.</span></h1>
    <div class="races">
      <div class="race-badge"><div class="race-dot" style="background:#e87e7e"></div><span>50-Miler — <strong>Oct 3, 2026</strong></span></div>
      <div class="race-badge"><div class="race-dot" style="background:#7e9ee8"></div><span>Sub-1:22 Half — <strong>November 2026</strong></span></div>
    </div>
  </div>
</div>

<div class="mode-nav">
  <div class="mode-nav-inner">
    <button class="mode-btn active" style="--mc:#7eb87e" onclick="setMode('run')">Running</button>
    <button class="mode-btn" style="--mc:#c8784e" onclick="setMode('lift')">Strength</button>
    <button class="mode-btn" style="--mc:#9e78c8" onclick="setMode('mob')">Mobility</button>
    <button class="mode-btn" style="--mc:#c8a96e" onclick="setMode('diet')">Diet</button>
  </div>
</div>

<div id="phaseNav" class="phase-nav"><div class="phase-nav-inner" id="phaseNavInner"></div></div>
<div id="splitNav" class="split-nav" style="display:none"><div class="split-nav-inner" id="splitNavInner"></div></div>

<div class="main" id="main"></div>

<script>
const PHASES = [
  { id:"base", label:"Phase 1 — Base Build", dates:"May 16 – Jun 13", subtitle:"4 weekday runs post-lift · No weekend runs yet", color:"#c8a96e", alpha:"rgba(200,169,110,0.33)",
    footer:{ label:"Phase 1 Key Rules", bg:"#141210", border:"#2a2520", items:["Post-lift easy days are easy. Period. Lifting is already a workout.","Friday is your longest day — treat it that way.","No weekend runs in this phase, but feel free to walk or hike.","Target 20–26 mpw through June 13. Build the engine before the load."] },
    weeks:[
      { week:1, dates:"May 18–22", totalMi:"20–22", days:[{day:"Tue",type:"Easy",detail:"4 mi easy · ~8:45–9:15/mi · post-lift flush"},{day:"Wed",type:"Workout",detail:"5 mi w/ 3×8 min @ comfortably hard (8:00–8:15) · 2 min jog recovery"},{day:"Thu",type:"Easy",detail:"4 mi easy · ~9:00–9:30/mi"},{day:"Fri",type:"Medium Long",detail:"6–7 mi easy-moderate · 8:30–9:00/mi · your longest day"}], notes:"All runs post-lift. Keep easy days genuinely easy — legs are pre-fatigued from lifting." },
      { week:2, dates:"May 25–29", totalMi:"22–24", days:[{day:"Tue",type:"Easy",detail:"4–5 mi easy · strides 4×20 sec at end"},{day:"Wed",type:"Workout",detail:"6 mi w/ 20 min tempo @ ~8:00/mi"},{day:"Thu",type:"Easy",detail:"4 mi easy · walk first 10 min if legs are trashed"},{day:"Fri",type:"Medium Long",detail:"7–8 mi moderate · introduce trail if available"}], notes:"Wednesday tempo: not all-out. You should be able to speak a sentence with effort." },
      { week:3, dates:"Jun 1–5", totalMi:"24–26", days:[{day:"Tue",type:"Easy",detail:"5 mi easy · conversational pace"},{day:"Wed",type:"Workout",detail:"6 mi w/ 4×1 mile @ 7:40–7:50 · 90 sec jog recovery"},{day:"Thu",type:"Easy",detail:"4 mi easy + drills"},{day:"Fri",type:"Medium Long",detail:"8–9 mi easy-moderate on trail if possible"}], notes:"Mile repeats: push here. First real peek at HM-pace fitness." },
      { week:4, dates:"Jun 8–12", totalMi:"18–20 (DOWN WEEK)", days:[{day:"Tue",type:"Easy",detail:"4 mi easy · honest recovery"},{day:"Wed",type:"Light Workout",detail:"5 mi w/ 2×10 min moderate · no heroics"},{day:"Thu",type:"Easy",detail:"3–4 mi easy"},{day:"Fri",type:"Easy-Moderate",detail:"5–6 mi easy · last run before schedule shifts"}], notes:"DOWN WEEK. Absorb the last 3 weeks. You're about to add weekend volume — arrive fresh." },
    ]

  { id:"ultra", label:"Phase 2 — Ultra Build", dates:"Jun 14 – Aug 15", subtitle:"Sat/Sun long runs added · Weekdays variable (keep Tue/Wed/Fri)", color:"#7eb87e", alpha:"rgba(126,184,126,0.33)",
    footer:{ label:"Ultra Training Non-Negotiables", bg:"#111612", border:"#1e2a1e", items:["Back-to-back weekend runs are the single most important ultra training tool.","Mon/Thu off = expected. Anchor on Tue/Wed/Fri.","Eat on all runs over 90 min. 60–90 cal every 30–40 min. Practice race nutrition.","Hike uphills. In races and in training. It's strategy, not weakness."] },
    weeks:[

      { time:"1:00", name:"World's Greatest Stretch", detail:"From a lunge: front hand inside front foot, rotate elbow toward floor, then reach to ceiling. 5 slow reps each side. Hits hip flexor, hamstring, and thoracic in one move." },
      { time:"0:45", name:"Standing Quad + Hip Flexor Combo", detail:"Stand on one foot. Pull opposite foot to glute (quad). Then tilt pelvis under — you'll feel the hip flexor engage. 30 sec each side." },
      { time:"1:15", name:"Downward Dog with Calf Pedal", detail:"Downward dog position. Alternate pressing each heel toward floor — 30 slow pedals. Hold each side 5 sec at end range. Combines hamstring, calf, and ankle dorsiflexion." },
    ]
  }
];

const DIET = {
  target:{ weight:"185 lb", protein:"215–265g", approach:"Robotic · High Protein · Sustainable" },
  meals:[
    { time:"AM", name:"Breakfast at Work", dot:"#f0c030", preview:"4 eggs + sausage + shake OR overnight oats",
      protein:"50–80g", proteinColor:"#c8a96e",
      options:[
        { label:"Option A", detail:"4 eggs + 2 sausage links + 1 banana + protein shake (30–40g protein shake)" },
        { label:"Option B", detail:"Overnight oats with protein powder mixed in — prep the night before" },
      ],
      runNote:"On big run days: add an extra shake or a second banana for carb support." },
    { time:"10 AM", name:"Snack 1", dot:"#7eb87e", preview:"1 tuna packet",
      protein:"25–35g", proteinColor:"#7eb87e",
      options:[
        { label:"What to have", detail:"1 tuna packet (flavored or plain — StarKist/Bumblebee single-serve). No prep. High protein, zero effort." },
      ],
      runNote:null },
    { time:"12 PM", name:"Robotic Lunch", dot:"#7e9ee8", preview:"7–8oz chicken + ¾ cup rice + veg",
      protein:"50–60g", proteinColor:"#7e9ee8",
      options:[
        { label:"Option A", detail:"7–8oz grilled chicken + ¾ cup cooked rice + broccoli or any green veg" },
        { label:"Option B", detail:"Ground meat (beef/turkey) + carrots and peas + potato on big run days" },
      ],
      runNote:"Add a potato or extra rice on Saturday long run days and the day before." },
    { time:"2 PM", name:"Snack 2", dot:"#9e9e9e", preview:"1 apple",
      protein:null, proteinColor:null,
      options:[
        { label:"What to have", detail:"1 apple. Keeps hunger at bay without a protein hit — you've already hit your midday target." },
      ],
      runNote:null },
    { time:"After Work", name:"After-Work Meal", dot:"#e87e7e", preview:"Big chicken salad container",
      protein:"50–60g", proteinColor:"#e87e7e",
      options:[
        { label:"What to have", detail:"6–8oz chicken breast + a full bagged salad (any variety). Pre-make the chicken in bulk. This is the easiest high-protein meal in the plan." },
      ],
      runNote:"After long run days, swap salad for rice or add one — your body needs the carbs." },
    { time:"Evening", name:"Dinner", dot:"#b87eb8", preview:"One controlled plate — meat + carb + veg",
      protein:"40–55g", proteinColor:"#b87eb8",
      options:[
        { label:"What to have", detail:"One plate: a protein source (any meat, 6–8oz), a carb (rice, potato, pasta), and a vegetable. Whatever the family is eating — just keep it one plate." },
      ],
      runNote:null },
  ],
  summary:[
    { meal:"Breakfast", p:"50–80g" },
    { meal:"Snack 1 (Tuna)", p:"25–35g" },
    { meal:"Lunch", p:"50–60g" },
    { meal:"Snack 2 (Apple)", p:"—" },
    { meal:"After-Work Meal", p:"50–60g" },
    { meal:"Dinner", p:"40–55g" },
  ],
  totalLow:"215g", totalHigh:"290g",
  tip:"Batch lunches once or twice a week — cook a big batch of chicken and rice on Sunday and Wednesday. Stay consistent and the weight will drop. The plan is designed to be robotic: the less you have to decide, the more you'll stick to it."
};

let mode='run', activePhase=0, openWeek=null, paceOpen=false, activeSplit=0, openEx=null, openMobDay=null, openMeal=null;

function render() {
  document.getElementById('phaseNav').style.display = mode==='run' ? 'block' : 'none';
  document.getElementById('splitNav').style.display = mode==='lift' ? 'block' : 'none';
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['run','lift','mob','diet'][i]===mode));
  if(mode==='run'){buildPhaseNav();buildRunMain();}
  else if(mode==='lift'){buildSplitNav();buildLiftMain();}
  else if(mode==='mob'){buildMobMain();}
  else buildDietMain();
}

function setMode(m){mode=m;openWeek=null;openEx=null;openMobDay=null;openMeal=null;render();window.scrollTo({top:0,behavior:'smooth'});}

function buildPhaseNav(){
  document.getElementById('phaseNavInner').innerHTML=PHASES.map((p,i)=>
    `<button class="phase-btn${i===activePhase?' active':''}" style="--pc:${p.color}" onclick="setPhase(${i})">${p.label.split(' — ')[0]}</button>`
  ).join('');
}
function setPhase(i){activePhase=i;openWeek=null;buildPhaseNav();buildRunMain();window.scrollTo({top:0,behavior:'smooth'});}

function buildRunMain(){
  const ph=PHASES[activePhase];
  const pRows=PACE_GUIDE.map(z=>`<div class="pace-row"><div class="pace-bar" style="background:${z.color}"></div><div class="pace-info"><div class="pace-zone" style="color:${z.color}">${z.zone}</div><div class="pace-feel">${z.feel}</div></div><div class="pace-val">${z.pace}</div></div>`).join('');
  const wCards=ph.weeks.map((w,wi)=>{
    const isDown=String(w.totalMi).includes('DOWN'), isRace=w.totalMi==='RACE WEEK', isOpen=openWeek===wi;
    const tag=isRace?'🏁 RACE':isDown?'↓ DOWN':`Wk ${w.week}`;
    const tc=isRace?'#f0c030':isDown?'#e8904e':ph.color;
    const dRows=w.days.map(d=>{const c=TYPE_COLORS[d.type]||'#555';return`<div class="day-row" style="border-left-color:${c}"><div class="day-lbl">${d.day}</div><div class="day-info"><div class="day-type" style="color:${c}">${d.type}</div><div class="day-detail">${d.detail}</div></div></div>`;}).join('');
    const note=w.notes?`<div class="coach-note" style="border-left-color:${ph.color}55"><div class="cn-label" style="color:${ph.color}">Coach's Note</div><div class="cn-text">${w.notes}</div></div>`:'';
    return`<div class="week-card${isOpen?' open':''}${isDown?' is-down':''}${isRace?' is-race':''}" style="--wca:${ph.alpha}"><button class="week-btn" onclick="toggleWeek(${wi})"><div class="week-left"><div class="week-tag" style="color:${tc}">${tag}</div><div class="week-dates">${w.dates}</div></div><div class="week-right"><div class="week-mi">${isRace?'Race day':'~'+w.totalMi+' mi'}</div><div class="week-tog">${isOpen?'−':'+'}</div></div></button><div class="week-body${isOpen?' open':''}"><div class="days-list">${dRows}</div>${note}</div></div>`;
  }).join('');
  let footer='';
  if(ph.footer){footer=`<div class="phase-footer" style="background:${ph.footer.bg};border:1px solid ${ph.footer.border}"><div class="fl" style="color:${ph.color}">${ph.footer.label}</div>${ph.footer.items.map(n=>`<div class="fi"><span class="fi-dash" style="color:${ph.color}">—</span><span class="fi-text">${n}</span></div>`).join('')}</div>`;}
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:${ph.color}">${ph.label}</div><div class="phase-sub">${ph.dates} · ${ph.subtitle}</div></div><button class="toggle-btn${paceOpen?' on':''}" onclick="togglePace()">${paceOpen?'Hide':'Pace'} Guide</button></div><div class="pace-guide${paceOpen?' open':''}"><div class="pg-label">Pace Zones</div>${pRows}</div>${wCards}${footer}`;
}
function toggleWeek(wi){openWeek=openWeek===wi?null:wi;buildRunMain();}
function togglePace(){paceOpen=!paceOpen;buildRunMain();}

function buildSplitNav(){
  document.getElementById('splitNavInner').innerHTML=SPLITS.map((s,i)=>
    `<button class="split-btn${i===activeSplit?' active':''}" style="--sc:${s.color}" onclick="setSplit(${i})">${s.label}</button>`
  ).join('');
}
function setSplit(i){activeSplit=i;openEx=null;buildSplitNav();buildLiftMain();}

function buildRPTBlock(){
  return `<div class="rpt-block"><div class="rpt-label">Reverse Pyramid Training</div>${RPT_SETS.map((s,i)=>`<div class="rpt-row${i===0?' top-set':''}"><span class="rpt-set">Set ${i+1}</span><span class="rpt-reps">${s.reps} reps</span><span class="rpt-note">${s.note}</span></div>`).join('')}</div>`;
}

function buildLiftMain(){
  const sp=SPLITS[activeSplit];
  const co=sp.callout?`<div class="callout"><div class="callout-title">${sp.callout.title}</div><div class="callout-text">${sp.callout.text}</div></div>`:'';
  let idx=0;
  const secs=sp.sections.map(sec=>{
    const sl=sec.mob?`<div class="sec-label" style="color:${sp.color}88">⬤ ${sec.label}</div>`:sec.superset?`<div class="superset-badge">⟳ Superset — ${sec.label}</div>`:`<div class="sec-label">${sec.label}</div>`;
    const exs=sec.exercises.map(ex=>{
      const key=`${activeSplit}-${idx}`;const isOpen=openEx===key;const isMob=!!sec.mob;idx++;
      const rptBadge=ex.rpt?`<span class="rpt-badge">RPT</span>`:'';
      const rptBlock=ex.rpt&&isOpen?buildRPTBlock():'';
      return`<div class="ex-card${isMob?' mob':''}"><div class="ex-head" onclick="toggleEx('${key}')"><div class="ex-num">${String(idx).padStart(2,'0')}</div><div class="ex-main"><div class="ex-name">${ex.n}<span class="ex-tag" style="color:${ex.tc};border:1px solid ${ex.tc}44">${ex.tag}</span>${rptBadge}</div><div class="ex-sets">${ex.sets}</div></div><div class="ex-chev${isOpen?' open':''}">+</div></div><div class="ex-body${isOpen?' open':''}"><div class="ex-cue">${ex.cue}</div>${rptBlock}<div class="ex-why">Why: ${ex.why}</div></div></div>`;
    }).join('');
    return sl+exs;
  }).join('');
  document.getElementById('main').innerHTML=`<div class="split-header"><div class="split-title" style="color:${sp.color}">${sp.fullLabel}</div><div class="split-meta">${sp.days}</div><div class="split-sched" style="border-left-color:${sp.color}">${sp.sched}</div></div>${co}${secs}`;
}
function toggleEx(key){openEx=openEx===key?null:key;buildLiftMain();}

function buildMobMain(){
  const cards=MOB_DAYS.map((d,i)=>{
    const isOpen=openMobDay===i;
    const moves=d.moves.map(m=>`<div class="mob-move"><div class="mob-time">${m.time}</div><div class="mob-info"><div class="mob-move-name">${m.name}</div><div class="mob-move-detail">${m.detail}</div></div></div>`).join('');
    return`<div class="mob-day-card"><div class="mob-day-head" onclick="toggleMobDay(${i})"><div class="mob-day-dot" style="background:${d.color}"></div><div><div class="mob-day-name">${d.day}</div><div class="mob-day-focus" style="color:${d.color}">${d.focus}</div></div><div style="flex:1"></div><div class="mob-day-chev${isOpen?' open':''}">+</div></div><div class="mob-day-body${isOpen?' open':''}"><div class="mob-tag">${d.context}</div>${moves}</div></div>`;
  }).join('');
  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:#9e78c8">Daily Mobility</div><div class="phase-sub">5 min per training day · all key areas covered across the week</div></div></div><div class="callout" style="border-color:#2a1e2a"><div class="callout-title" style="color:#9e78c8">How to Use This</div><div class="callout-text">Do your assigned day's routine on every training day. Thursday's ankle routine goes BEFORE your leg workout — it's prep, not cooldown. Friday's hamstring routine goes AFTER your run as a cooldown. All others can go before or after lifting. Each routine is exactly 5 minutes. Tap a day to expand.</div></div>${cards}`;
}
function toggleMobDay(i){openMobDay=openMobDay===i?null:i;buildMobMain();}

function buildDietMain(){
  const d=DIET;
  const statsHtml=`<div class="diet-hero"><div class="diet-hero-title">185 lb Transformation Plan</div><div class="diet-stats"><div class="diet-stat"><div class="diet-stat-val">${d.target.protein}</div><div class="diet-stat-lbl">Daily Protein</div></div><div class="diet-stat"><div class="diet-stat-val">${d.target.weight}</div><div class="diet-stat-lbl">Target Weight</div></div><div class="diet-stat" style="flex:2"><div class="diet-stat-val" style="font-size:12px;padding-top:4px">${d.target.approach}</div><div class="diet-stat-lbl">Philosophy</div></div></div></div>`;

  const mealCards=d.meals.map((m,i)=>{
    const isOpen=openMeal===i;
    const pBadge=m.protein?`<span class="meal-protein" style="color:${m.proteinColor};border-color:${m.proteinColor}44">${m.protein}</span>`:`<span class="meal-protein none">—</span>`;
    const optHtml=m.options.map(o=>`<div class="meal-option"><div class="meal-opt-label">${o.label}</div><div class="meal-opt-detail">${o.detail}</div></div>`).join('');
    const runNote=m.runNote?`<div class="meal-run-note">🏃 ${m.runNote}</div>`:'';
    return`<div class="meal-card"><div class="meal-head" onclick="toggleMeal(${i})"><div class="meal-time">${m.time}</div><div class="meal-dot" style="background:${m.dot}"></div><div class="meal-info"><div class="meal-name">${m.name}</div><div class="meal-preview">${m.preview}</div></div>${pBadge}<div class="meal-chev${isOpen?' open':''}">+</div></div><div class="meal-body${isOpen?' open':''}"><div style="padding-top:4px">${optHtml}${runNote}</div></div></div>`;
  }).join('');

  const summaryRows=d.summary.map(r=>`<div class="ps-row"><span class="ps-meal">${r.meal}</span><span class="ps-p">${r.p}</span></div>`).join('');
  const summaryHtml=`<div class="protein-summary"><div class="ps-label">Daily Protein Breakdown</div>${summaryRows}<div class="ps-total"><span class="ps-meal">Total Daily Target</span><span class="ps-p">${d.totalLow}–${d.totalHigh}g</span></div></div>`;

  const tipHtml=`<div class="diet-tip"><div class="diet-tip-label">Prep Tip</div><div class="diet-tip-text">${d.tip}</div></div>`;

  document.getElementById('main').innerHTML=`<div class="phase-header"><div><div class="phase-title" style="color:#c8a96e">Nutrition Plan</div><div class="phase-sub">High protein · robotic · built around your training schedule</div></div></div>${statsHtml}${mealCards}${summaryHtml}${tipHtml}`;
}
function toggleMeal(i){openMeal=openMeal===i?null:i;buildDietMain();}

render();
</script>
</body>
</html>
